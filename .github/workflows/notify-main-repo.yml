name: Notify Main Repo

on:
  push:
    branches:
      - main

jobs:
  notify-main-repo:
    runs-on: ubuntu-latest

    steps:
      - run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.WEBSITE_BREAKER_DISPATCH }}" \
            https://api.github.com/repos/oc-2/website-breaker/dispatches \
            -d '{"event_type":"submodule-update"}'
    
      - name: Trigger main repo workflow
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.WEBSITE_BREAKER_DISPATCH }}
          repository: oc-2/website-breaker
          event-type: submodule-update
