name: Notify Main Repo

on:
  push:
    branches:
      - main

jobs:
  notify-main-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger main repo workflow
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.WEBSITE_BREAKER_DISPATCH }}
          repository: oc-2/website-breaker
          event-type: submodule-update
